schema_version: 1

defaults:
  deployable_readiness_states:
    - deployable
  route_refs:
    pager_core:
      description: Page on confirmed core scenario outages or unsafe behavior.
    team_non_paging:
      description: Notify the owning team without paging.
    diagnostics_backlog:
      description: Record diagnostic-only signals for later review.

scenarios:
  - scenario_id: load_markdown_preview
    criticality: core
    readiness: deployable
    runtime_binding:
      scenario_id: load_markdown_preview
      scenario_version: '1'
      checkpoint_ids:
        - route_to_viewer
        - render_markdown
        - viewer_usable
    primary_alert:
      kind: scheduled_query
      signal_type: synthetic_availability
      severity: page
      route_ref: pager_core
      rule_kind: log_search_alert
      window: PT15M
      evaluation_frequency: PT5M
      threshold:
        consecutive_failures: 2
        minimum_sample_size: 2
    supporting_alerts:
      - kind: scheduled_query
        signal_type: real_user_failure_rate
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_rate_percent: 5
          minimum_sample_size: 10
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: render_markdown
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3

  - scenario_id: show_inline_request_popup
    criticality: core
    readiness: deployable
    runtime_binding:
      scenario_id: show_inline_request_popup
      scenario_version: '1'
      checkpoint_ids:
        - selection_recognized
        - popup_shown
        - scope_accurate
    primary_alert:
      kind: scheduled_query
      signal_type: synthetic_availability
      severity: page
      route_ref: pager_core
      rule_kind: log_search_alert
      window: PT15M
      evaluation_frequency: PT5M
      threshold:
        consecutive_failures: 2
        minimum_sample_size: 2
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: scope_accurate
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3

  - scenario_id: submit_request_receive_review
    criticality: core
    readiness: deployable
    runtime_binding:
      scenario_id: submit_request_receive_review
      scenario_version: '1'
      checkpoint_ids:
        - request_submitted
        - pending_visible
        - review_rendered_inline
    primary_alert:
      kind: scheduled_query
      signal_type: real_user_failure_rate
      severity: page
      route_ref: pager_core
      rule_kind: log_search_alert
      window: PT15M
      evaluation_frequency: PT5M
      threshold:
        failure_rate_percent: 10
        minimum_sample_size: 10
    supporting_alerts:
      - kind: scheduled_query
        signal_type: latency
        checkpoint_id: review_rendered_inline
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          p95_duration_ms: 2000
          minimum_sample_size: 10
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: review_rendered_inline
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3

  - scenario_id: apply_suggested_change
    criticality: core
    readiness: deployable
    runtime_binding:
      scenario_id: apply_suggested_change
      scenario_version: '1'
      checkpoint_ids:
        - apply_available
        - mutate_targeted_range
        - render_refresh
    primary_alert:
      kind: scheduled_query
      signal_type: real_user_failure_rate
      severity: page
      route_ref: pager_core
      rule_kind: log_search_alert
      window: PT15M
      evaluation_frequency: PT5M
      threshold:
        failure_rate_percent: 5
        minimum_sample_size: 10
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: mutate_targeted_range
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 2

  - scenario_id: reject_suggested_change
    criticality: core
    readiness: deployable
    runtime_binding:
      scenario_id: reject_suggested_change
      scenario_version: '1'
      checkpoint_ids:
        - reject_available
        - document_unchanged
        - review_dismissed
    primary_alert:
      kind: scheduled_query
      signal_type: synthetic_availability
      severity: diagnostic_only
      route_ref: diagnostics_backlog
      rule_kind: log_search_alert
      window: PT30M
      evaluation_frequency: PT5M
      threshold:
        consecutive_failures: 3
        minimum_sample_size: 3
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: document_unchanged
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 2

  - scenario_id: start_next_request_cycle
    criticality: important
    readiness: deployable
    runtime_binding:
      scenario_id: start_next_request_cycle
      scenario_version: '1'
      checkpoint_ids:
        - first_cycle_cleared
        - fresh_selection_starts_popup
        - current_state_reused
    primary_alert:
      kind: scheduled_query
      signal_type: synthetic_availability
      severity: non_paging
      route_ref: team_non_paging
      rule_kind: log_search_alert
      window: PT30M
      evaluation_frequency: PT5M
      threshold:
        consecutive_failures: 3
        minimum_sample_size: 3
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: current_state_reused
        severity: diagnostic_only
        route_ref: diagnostics_backlog
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3

  - scenario_id: stable_viewer_on_render_failure
    criticality: important
    readiness: deployable
    runtime_binding:
      scenario_id: stable_viewer_on_render_failure
      scenario_version: '1'
      checkpoint_ids:
        - viewer_remains_active
        - failure_state_visible
        - document_preserved
    primary_alert:
      kind: scheduled_query
      signal_type: synthetic_availability
      severity: non_paging
      route_ref: team_non_paging
      rule_kind: log_search_alert
      window: PT30M
      evaluation_frequency: PT5M
      threshold:
        consecutive_failures: 3
        minimum_sample_size: 3
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: failure_state_visible
        severity: non_paging
        route_ref: team_non_paging
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3

  - scenario_id: preserve_document_on_execution_failure
    criticality: important
    readiness: deployable
    runtime_binding:
      scenario_id: preserve_document_on_execution_failure
      scenario_version: '1'
      checkpoint_ids:
        - failure_visible
        - review_apply_blocked
        - document_preserved
    primary_alert:
      kind: scheduled_query
      signal_type: real_user_failure_rate
      severity: non_paging
      route_ref: team_non_paging
      rule_kind: log_search_alert
      window: PT30M
      evaluation_frequency: PT5M
      threshold:
        failure_rate_percent: 10
        minimum_sample_size: 5
    supporting_alerts:
      - kind: scheduled_query
        signal_type: checkpoint_spike
        checkpoint_id: document_preserved
        severity: page
        route_ref: pager_core
        rule_kind: log_search_alert
        window: PT15M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 1
      - kind: scheduled_query
        signal_type: exception_spike
        severity: diagnostic_only
        route_ref: diagnostics_backlog
        rule_kind: log_search_alert
        window: PT30M
        evaluation_frequency: PT5M
        threshold:
          failure_count: 3
