name: Auto-merge Enabler

# Triggered when any label is added to a PR. Checks if all agentic review
# signals are green and enables auto-merge if they are.
on:
  pull_request:
    types: [labeled, ready_for_review]

permissions:
  contents: write

jobs:
  enable-automerge:
    name: Enable auto-merge for eligible PRs
    runs-on: ubuntu-latest
    steps:
      - name: Check labels and manage auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]' -R "$REPO")

          HAS_SECURITY_CLEARED=$(echo "$LABELS" | jq -r 'contains(["security-cleared"])')
          HAS_MAINTAINABILITY_CLEARED=$(echo "$LABELS" | jq -r 'contains(["maintainability-cleared"])')

          # Any blocked or needs-review signal should prevent auto-merge
          HAS_BLOCKING=$(echo "$LABELS" | jq -r 'any(.[]; . == "security-blocked" or . == "security-needs-review" or . == "maintainability-blocked" or . == "maintainability-needs-review")')

          # Protected paths must route to human review
          PROTECTED_COUNT=$(gh pr view "$PR_NUMBER" \
            --json files \
            --jq '[.files[].path | select(
              startswith(".github/workflows/") or
              startswith("src/telemetry/") or
              startswith("architecture/")
            )] | length' \
            -R "$REPO")

          echo "security-cleared:         $HAS_SECURITY_CLEARED"
          echo "maintainability-cleared:  $HAS_MAINTAINABILITY_CLEARED"
          echo "has-blocking-labels:      $HAS_BLOCKING"
          echo "protected-file-count:     $PROTECTED_COUNT"

          if [ "$HAS_BLOCKING" = "true" ]; then
            echo "🚫 Blocking label present. Disabling auto-merge if enabled."
            gh pr merge "$PR_NUMBER" --disable-auto -R "$REPO" 2>/dev/null \
              || echo "Auto-merge was not enabled; nothing to disable."

          elif [ "$HAS_SECURITY_CLEARED" = "true" ] \
            && [ "$HAS_MAINTAINABILITY_CLEARED" = "true" ] \
            && [ "$PROTECTED_COUNT" = "0" ]; then
            echo "✅ Eligible for auto-merge. Enabling auto-merge."
            gh pr merge "$PR_NUMBER" --auto --squash -R "$REPO"

          else
            echo "⏭ Conditions not yet met. Waiting for all signals."
          fi
